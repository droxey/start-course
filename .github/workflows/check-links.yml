name: check-links

on:
  push:
  pull_request:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run check-links
      # Lists links from public pages to private .md files (non-strict for now).
      - run: sh scripts/build-site.sh
