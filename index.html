<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- UPDATE: Replace every ALL_CAPS placeholder before publishing a course. -->
    <title>COURSE_TITLE</title>
    <meta name="description" content="COURSE_DESCRIPTION">
    <meta name="author" content="COURSE_INSTRUCTOR (INSTRUCTOR_EMAIL)">
    <meta property="og:site_name" content="COURSE_TITLE">
    <meta property="og:title" content="COURSE_TITLE">
    <meta property="og:description" content="COURSE_DESCRIPTION">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="COURSE_KEYWORDS">
    <meta property="og:type" content="website">
    <!-- UPDATE: Replace GITHUB_ORG and REPO_NAME. -->
    <meta property="og:url" content="https://GITHUB_ORG.github.io/REPO_NAME">
    <meta property="og:image" content="https://GITHUB_ORG.github.io/REPO_NAME/web/logo-icononly.svg">
    <meta property="og:image:secure_url" content="https://GITHUB_ORG.github.io/REPO_NAME/web/logo-icononly.svg">
    <meta property="og:image:type" content="image/svg+xml">
    <meta property="og:image:width" content="250">
    <meta property="og:image:height" content="250">
    <meta property="og:image:alt" content="COURSE_TITLE">
    <!-- ACS-3220 stack: theme-simple-dark.css is active by default. theme-simple.css is a disabled alternate swapped by the toggle. Do not load any other theme. -->
    <link id="theme-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css" title="dark">
    <link id="theme-light" rel="stylesheet alternate" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0.9.0/dist/css/theme-simple.css" title="light" disabled>
    <meta name="color-scheme" content="dark">
    <script>
      // Runs before first paint. Dark is the default; a saved "light" choice swaps sheets here.
      function applyTheme(theme) {
        var light = theme === 'light'
        document.getElementById('theme-dark').disabled = light
        document.getElementById('theme-light').disabled = !light
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
        document.querySelector('meta[name="color-scheme"]').content = light ? 'light' : 'dark'
      }
      try { applyTheme(localStorage.getItem('docsify-theme')) } catch (e) { applyTheme('dark') }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-gifcontrol@0.2.1/dist/docsify-gifcontrol.css">
    <link rel="stylesheet" href="web/style.css">
    <style>
      #theme-toggle {
        position: fixed;
        z-index: 35;
        right: 16px;
        bottom: 16px;
        margin: 0;
        padding: 8px 12px;
        border: 1px solid var(--mono-tint2, #6a7c88);
        border-radius: 4px;
        background: var(--base-background-color, #243033);
        color: var(--base-color, #d3d3d3);
        font: 600 14px/1 Source Sans Pro, Helvetica, Arial, sans-serif;
        cursor: pointer;
      }
      #theme-toggle:focus-visible {
        outline: 2px solid var(--theme-color, #8ec8e8);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <button type="button" id="theme-toggle" aria-label="Switch to light theme">Light theme</button>
    <script>
      (function () {
        var btn = document.getElementById('theme-toggle')
        var next = function () {
          return document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'
        }
        var label = function () {
          btn.textContent = next() === 'light' ? 'Light theme' : 'Dark theme'
          btn.setAttribute('aria-label', 'Switch to ' + next() + ' theme')
        }
        label()
        btn.addEventListener('click', function () {
          var theme = next()
          applyTheme(theme)
          try { localStorage.setItem('docsify-theme', theme) } catch (e) {}
          label()
        })
      })()
    </script>
    <!-- UPDATE: name, repo, search.namespace, and logo. -->
    <script>
      window.$docsify = {
        // Leave empty until you add web/logo-icononly.svg, then set: 'web/logo-icononly.svg'
        logo: '',
        name: 'COURSE_NAME',
        repo: 'GITHUB_ORG/REPO_NAME',
        themeColor: '#8ec8e8',
        formatUpdated: '{MM}/{DD} {HH}:{mm}',
        // Off: a <script> in any published .md would run as first-party JS.
        executeScript: false,
        auto2top: true,
        autoHeader: false,
        loadSidebar: true,
        loadNavbar: true,
        // Sidebar depth. Do not set maxLevel twice — the second value wins and the first is dead config.
        maxLevel: 3,
        subMaxLevel: 2,
        el: "#app",
        themeable: {
          readyTransition: true,
          responsiveTables: true
        },
        search: {
          maxAge: 0,
          paths: "auto",
          placeholder: 'Search class content...',
          noData: 'No Results!',
          depth: 4,
          hideOtherSidebarContent: false,
          namespace: 'REPO_NAME',
        },
        copyCode: {
          buttonText: '📋 Click to Copy',
          errorText: '',
          successText: '✓'
        },
        'flexible-alerts': {
          style: 'flat'
        },
        tabs: {
          persist: true,
          sync: true,
          theme: 'classic',
          tabComments: true,
          tabHeadings: true
        },
        pagination: {
          previousText: 'Previous Module',
          nextText: 'Next Module',
          crossChapter: true,
          crossChapterText: true
        },
        // 600s matches GitHub Pages cache-control for markdown.
        requestHeaders: {
          'cache-control': 'max-age=600'
        },
        plugins: [
          function (hook) {
            hook.ready(function () {
              var root = document.querySelector('.search') || document.body
              var strip = function () {
                document.querySelectorAll('.matching-post').forEach(function (post) {
                  post.querySelectorAll('h2, p').forEach(function (el) {
                    var text = el.textContent.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()
                    if (el.textContent !== text) el.textContent = text
                  })
                })
              }
              new MutationObserver(strip).observe(root, { childList: true, subtree: true })
            })
          }
        ],
        gifcontrol: {
          mode: 'hover',
          loadingWidth: '300px',
          loadingHeight: '200px',
          overlayColor: 'rgba(0, 0, 0, 0.6)',
          iconColor: 'rgba(255, 255, 255, 0.95)',
          playIcon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm115.7 272l-176 101c-15.8 8.8-35.7-2.5-35.7-21V152c0-18.4 19.8-29.8 35.7-21l176 107c16.4 9.2 16.4 32.9 0 42z"/></svg>',
          errorIcon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"><path d="M569.517 440.013C587.975 472.007 564.806 512 527.94 512H48.054c-36.937 0-59.999-40.055-41.577-71.987L246.423 23.985c18.467-32.009 64.72-31.951 83.154 0l239.94 416.028zM288 354c-25.405 0-46 20.595-46 46s20.595 46 46 46 46-20.595 46-46-20.595-46-46-46zm-43.673-165.346l7.418 136c.347 6.364 5.609 11.346 11.982 11.346h48.546c6.373 0 11.635-4.982 11.982-11.346l7.418-136c.375-6.874-5.098-12.654-11.982-12.654h-63.383c-6.884 0-12.356 5.78-11.981 12.654z"/></svg>',
          errorText: "Error loading image",
          errorTextColor: "#f2f2f2",
          spinnerBarColor: 'rgb(45, 140, 240)',
          spinnerTrackColor: 'rgba(45, 140, 240, .3)',
        }
      }
    </script>
    <!-- Pinned jsDelivr URLs, no SRI. Cloning this template accepts that CDN trust. -->

        navigator.serviceWorker.register('web/sw.js')
